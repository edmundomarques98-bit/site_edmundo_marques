<!doctype html><html><head><style>html,body{margin:0;background:transparent}#m{position:relative;width:946px;height:1504px}#m img,#m svg{position:absolute;left:0;top:0}</style></head><body>
<div id="m"><img src="mundo.png" width="946" height="1504">
<svg width="946" height="1504" viewBox="0 0 946 1504">
<defs>
 <linearGradient id="suit" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#101219"/><stop offset=".5" stop-color="#262a38"/><stop offset="1" stop-color="#0d0f16"/></linearGradient>
 <linearGradient id="suitV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f40"/><stop offset="1" stop-color="#0b0c12"/></linearGradient>
 <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#dfe5f5"/><stop offset="1" stop-color="#aab4cf"/></linearGradient>
 <linearGradient id="tie" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a14c8"/><stop offset=".45" stop-color="#2f5bff"/><stop offset="1" stop-color="#0000a8"/></linearGradient>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".6"/></filter>
 <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="stripe" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="14" height="14" fill="none"/><rect width="4" height="14" fill="#8fb0ff" opacity=".35"/></pattern>
</defs>
<!-- jacket body filling the open front -->

<!-- shirt V -->
<path d="M362 528 L505 520 L446 770 Z" fill="url(#shirt)" filter="url(#sh)"/>
<!-- collar points -->
<path d="M362 528 L430 545 L398 600 Z" fill="#f4f6fc" stroke="#b9c2dc" stroke-width="1.5"/>
<path d="M505 520 L430 545 L470 596 Z" fill="#e6ebf7" stroke="#b9c2dc" stroke-width="1.5"/>
<!-- tie -->
<g filter="url(#sh)">
 <path d="M415 548 L448 546 L452 580 L416 582 Z" fill="url(#tie)"/>
 <path d="M416 582 L452 580 L470 720 L438 760 L404 722 Z" fill="url(#tie)"/>
 <path d="M416 582 L452 580 L470 720 L438 760 L404 722 Z" fill="url(#stripe)"/>
</g>
<!-- lapels -->
<path d="M343 530 Q356 522 368 524 L404 640 L446 800 Q400 735 352 700 Q346 620 343 530 Z" fill="url(#suit)" stroke="#2f5bff" stroke-width="3" filter="url(#sh)"/>
<path d="M505 520 Q516 520 524 528 Q526 620 522 700 Q484 735 446 800 L485 640 Z" fill="url(#suit)" stroke="#2f5bff" stroke-width="3" filter="url(#sh)"/>
<path d="M368 524 L404 640 L446 800" stroke="#5f86ff" stroke-width="3" fill="none" filter="url(#gl)" opacity=".9"/>
<path d="M505 520 L485 640 L446 800" stroke="#5f86ff" stroke-width="3" fill="none" filter="url(#gl)" opacity=".9"/>
<!-- buttons -->
<circle cx="448" cy="835" r="9" fill="#0b0c12" stroke="#5f86ff" stroke-width="2.5"/>
<circle cx="448" cy="880" r="9" fill="#0b0c12" stroke="#5f86ff" stroke-width="2.5"/>
<!-- pocket square + EM pin -->
<path d="M492 688 L516 684 L517 692 L493 696 Z" fill="#8fb0ff" filter="url(#gl)"/>
<g transform="translate(378 652) scale(.8)" filter="url(#gl)"><rect x="-22" y="-14" width="44" height="28" rx="6" fill="#05072e" stroke="#5f86ff" stroke-width="2"/><text x="0" y="8" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="18" fill="#2f5bff">EM</text></g>
</svg></div></body></html>
