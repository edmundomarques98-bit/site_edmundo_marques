<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Anton';src:url('../carrossel-quem-e/fonts/anton.woff2') format('woff2')}
@font-face{font-family:'Montserrat';src:url('../carrossel-quem-e/fonts/montserrat.woff2') format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
.post{width:1088px;height:1456px;position:relative;overflow:hidden;font-family:'Montserrat',Arial,sans-serif;color:#fff;background-size:cover;background-position:center}

/* escurecimento para leitura */
.fade{position:absolute;left:0;right:0}
.fade.bottom{bottom:0;height:62%;background:linear-gradient(180deg,#02030c00 0%,#02030cb3 38%,#02030cf2 70%,#02030c 100%)}
.fade.top{top:0;height:52%;background:linear-gradient(0deg,#02030c00 0%,#02030cb3 40%,#02030cf0 100%)}
.fade.fbot{bottom:0;height:22%;background:linear-gradient(180deg,#02030c00,#02030ce6 70%)}
.fade.mid{top:30%;height:42%;background:radial-gradient(ellipse 70% 50% at 50% 50%,#02030ccc 0%,#02030c00 75%)}

/* topo */
.mark{position:absolute;top:58px;left:72px;height:40px;filter:brightness(0) invert(1);opacity:.95}
.tag{position:absolute;top:62px;right:72px;font-size:18px;font-weight:700;letter-spacing:.32em;color:#9fb3ff;border:1.5px solid #4f78ff88;border-radius:40px;padding:10px 22px 9px;background:#02030c66}

/* bloco de texto */
.block{position:absolute;left:72px;right:72px}
.block.bottom{bottom:200px}
.block.top{top:170px}
.block.center{top:45%;transform:translateY(-50%);text-align:center}
.kicker{font-size:20px;font-weight:700;letter-spacing:.3em;color:#7f9bff;margin-bottom:22px}
.kicker b{color:#fff}
h1{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;line-height:.94;font-size:150px;letter-spacing:.005em;transform:skewX(-9deg);transform-origin:left bottom;text-shadow:0 6px 30px #000a}
.center h1{transform-origin:center bottom}
h1 .l{display:block;white-space:nowrap}
h1 .acc{background:linear-gradient(180deg,#9fb6ff 0%,#4f78ff 55%,#2440ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #2f5bffcc);text-shadow:none}
.rule{width:110px;height:4px;background:#2f5bff;box-shadow:0 0 16px #2f5bff;margin:34px 0 26px;border-radius:2px}
.center .rule{margin-left:auto;margin-right:auto}
.sub{font-size:31px;line-height:1.42;color:#dbe4ff;max-width:760px;font-weight:500}
.center .sub{margin:0 auto}
.sub strong{color:#fff;font-weight:700}

/* faixa letreiro */
.ticker{position:absolute;left:-40px;right:-40px;bottom:156px;transform:rotate(-3deg);background:#1f45ff;box-shadow:0 0 40px #2f5bff99;padding:12px 0 10px;white-space:nowrap;overflow:hidden;font-family:'Anton',sans-serif;font-size:30px;letter-spacing:.12em;color:#fff}

/* rodape */
.foot{position:absolute;left:72px;right:72px;bottom:58px;display:flex;align-items:center;gap:32px}
.foot .logo{height:46px;filter:brightness(0) invert(1)}
.foot .sep{width:1.5px;height:48px;background:#ffffff40}
.foot .info{display:flex;align-items:center;gap:12px;font-size:19px;line-height:1.25;color:#dbe4ff}
.foot .info small{display:block;font-size:13px;color:#9fb3ff;letter-spacing:.04em}
.foot .info b{color:#fff}
.foot svg{width:28px;height:28px;color:#9fb3ff}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 3.5h3l1.5 4-2 1.3a11 11 0 0 0 7.7 7.7l1.3-2 4 1.5v3a2 2 0 0 1-2 2A17 17 0 0 1 3 5.5a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="ig" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></g></symbol>
</svg>
<section class="post" id="post"></section>
<script>
const P = [
  {pos:'bottom', tag:'MARKETING', h:['Visão de','<span class="acc">alto nível</span>'], sub:'Estratégias inteligentes para posicionar sua marca <strong>acima da concorrência.</strong>'},
  {pos:'bottom', tag:'REDES SOCIAIS', h:['Amplifique','<span class="acc">sua marca</span>'], sub:'Mais alcance, mais conexão e <strong>mais presença nas redes.</strong>'},
  {pos:'bottom', tag:'ESTRATÉGIA', kicker:'/// <b>Estratégia que impulsiona</b>', h:['MKT','<span class="acc">digital</span>'], size:190},
  {pos:'bottom', tag:'# MARKETING', h:['Nova visão','<span class="acc">digital</span>'], sub:'Estratégias modernas para destacar sua marca <strong>no presente e no futuro.</strong>'},
  {pos:'bottom', tag:'# MARKETING', h:['Explore','<span class="acc">o digital</span>'], sub:'Ideias criativas para levar sua marca <strong>além dos limites.</strong>'},
  {pos:'top', tag:'MARKETING DIGITAL', h:['<span class="acc">Destaque-se</span>'], size:170, sub:'Sua marca não precisa competir. Precisa <strong>aparecer do jeito certo.</strong>', ticker:true},
  {pos:'bottom', tag:'CRESCIMENTO', h:['Impulsione','<span class="acc">sua marca</span>'], sub:'Decole com <strong>estratégia digital.</strong>'},
  {pos:'bottom', tag:'ESTRATÉGIA', h:['Jogue para','<span class="acc">vencer</span>'], sub:'Estratégia certa para liderar no digital e <strong>conquistar novos clientes.</strong>'},
  {pos:'center', tag:'RESULTADOS', h:['Domine','<span class="acc">o digital</span>'], sub:'Conquiste <strong>resultados reais</strong> no digital.'},
  {pos:'bottom', tag:'VENDAS', h:['Entre no jogo','<span class="acc">digital</span>'], size:138, sub:'Sua marca no controle das vendas <strong>com estratégia.</strong>'},
];
const q = new URLSearchParams(location.search);
const n = +(q.get('n')||1), d = P[n-1];
const post = document.getElementById('post');
if (q.get('bg')) post.style.backgroundImage = `url(${q.get('bg')})`;
const fades = d.pos==='bottom' ? '<div class="fade bottom"></div>'
  : d.pos==='top' ? '<div class="fade top"></div><div class="fade fbot"></div>'
  : '<div class="fade mid"></div><div class="fade fbot"></div>';
const ticker = d.ticker ? `<div class="ticker">${'DIGITAL &nbsp;·&nbsp; MARKETING &nbsp;·&nbsp; '.repeat(8)}</div>` : '';
post.innerHTML = `${fades}
  <img class="mark" src="../../assets/simbolo.png" alt="">
  <div class="tag">${d.tag}</div>
  <div class="block ${d.pos}">
    ${d.kicker?`<div class="kicker">${d.kicker}</div>`:''}
    <h1 style="font-size:${d.size||150}px">${d.h.map(l=>`<span class="l">${l}</span>`).join('')}</h1>
    ${d.sub?`<div class="rule"></div><p class="sub">${d.sub}</p>`:''}
  </div>
  ${ticker}
  <div class="foot">
    <img class="logo" src="../../assets/logo.png" alt="Edmundo Marques">
    <span class="sep"></span>
    <span class="info"><svg><use href="#phone"/></svg><span><small>WhatsApp</small><b>(88) 99624-5526</b></span></span>
    <span class="info"><svg><use href="#ig"/></svg><span><small>Instagram</small><b>@edmundom117</b></span></span>
  </div>`;
</script>
</body>
</html>
